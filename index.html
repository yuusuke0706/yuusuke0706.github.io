<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="5つの質問からあなたのいいところを診断します">
  <title>あなたのいいところ診断</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">

    <!-- スタート画面 -->
    <section id="start-screen" class="screen active">
      <div class="icon">✨</div>
      <p class="label">PERSONALITY CHECK</p>
      <h1>あなたの<br><span>いいところ診断</span></h1>
      <p class="description">
        5つの質問に答えるだけで、<br>
        あなたの魅力を診断します。
      </p>

      <button id="start-btn" class="main-btn">
        診断をはじめる
        <span>→</span>
      </button>
    </section>

    <!-- 質問画面 -->
    <section id="quiz-screen" class="screen">
      <div class="quiz-header">
        <span id="question-number">QUESTION 1 / 5</span>
        <span id="progress-percent">20%</span>
      </div>

      <div class="progress">
        <div id="progress-bar"></div>
      </div>

      <div class="question-box">
        <p class="question-label">QUESTION</p>
        <h2 id="question-text"></h2>
      </div>

      <div id="answers" class="answers"></div>
    </section>

    <!-- 結果画面 -->
    <section id="result-screen" class="screen">
      <p class="label">YOUR RESULT</p>
      <div id="result-icon" class="result-icon">✨</div>

      <p>あなたのいいところは</p>
      <h1 id="result-title"></h1>

      <div class="result-card">
        <p id="result-description"></p>
      </div>

      <button id="retry-btn" class="main-btn">
        もう一度診断する
        <span>↻</span>
      </button>
    </section>

  </main>

  <footer>
    <p>あなたの魅力は、あなたにしかない。</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
